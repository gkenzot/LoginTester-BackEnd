# ========================
# CONFIGURAÇÕES PRINCIPAIS
# ========================
spring.application.name=logintester

# ========================
# DATABASE (PostgreSQL)
# ========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA/HIBERNATE
# ========================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.show-sql: ativado apenas no perfil dev (application-dev.properties)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true

# ========================
# SERVER CONFIGURATION
# ========================
server.port=${PORT:8080}

# ========================
# JWT CONFIGURATION
# ========================
jwt.secret-key=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ========================
# REDIS CONFIGURATION
# ========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ========================
# LOGGING
# ========================
logging.level.com.example.loginauthapi=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ========================
# SWAGGER CONFIGURATION
# ========================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ========================
# HEALTH CHECKS
# ========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ========================
# ENVIRONMENT CONFIG
# ========================
spring.config.import=optional:file:.env[.properties]

# ========================
# EMAIL CONFIGURATION (SMTP Google)
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

app.email.from=${EMAIL_FROM}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ========================
# SEGURANÇA (produção)
# ========================
# Cookie de logout: true em HTTPS para secure flag
app.cookie.secure=${APP_COOKIE_SECURE:false}
# HSTS: habilitar em produção (HTTPS)
app.security.hsts-enabled=${APP_SECURITY_HSTS_ENABLED:false}

# ========================
# POLÍTICA DE SENHA (lista de senhas fracas – separadas por vírgula)
# ========================
app.password.common-passwords=123456,password,123456789,12345678,12345,1234567,1234567890,qwerty,abc123,password123

# ========================
# PROFILE PHOTO UPLOAD
# ========================
app.upload.profile-photo-dir=${PROFILE_PHOTO_DIR:uploads/profile-photos}
app.upload.profile-photo-max-size-bytes=${PROFILE_PHOTO_MAX_SIZE_BYTES:2097152}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB